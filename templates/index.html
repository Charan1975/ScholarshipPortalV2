<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Eligibility System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container-box{
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }

        h1{
            text-align: center;
            color: #0d6efd;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .btn-custom{
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border-radius: 10px;
        }

    </style>

</head>
<body>

    <div class="container-box">

        <h1>Scholarship Eligibility System</h1>

        <form action="/predict" method="POST">

            <div class="mb-3">
                <label>Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>CGPA</label>
                <input type="number" step="0.01" name="cgpa" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Family Income</label>
                <input type="number" name="income" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Attendance (%)</label>
                <input type="number" name="attendance" class="form-control" required>
            </div>
            <div class="mb-3">

    <label>Category</label>

    <select name="category" class="form-control" required>

        <option value="">Select Category</option>

        <option value="General">General</option>

        <option value="OBC">OBC</option>

        <option value="SC">SC</option>

        <option value="ST">ST</option>

        <option value="Minority">Minority</option>

    </select>

</div>

            <div class="mb-4">
                <label>Backlogs</label>
                <input type="number" name="backlogs" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary btn-custom">
                Check Eligibility
            </button>

        </form>

    </div>

</body>
</html>
